[package]
name = "nero-media-proxy"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true, optional = true }
axum = "0.8.6"
bytes = { workspace = true }
http = { workspace = true }
librqbit = { version = "8.1.1", optional = true }
reqwest = { version = "0.12.23", features = ["stream"] }
serde = { workspace = true }
thiserror = "2.0.17"
tokio = { workspace = true, features = ["net"] }
tokio-util = { version = "0.7.18", optional = true }
tracing = { workspace = true }
url = { workspace = true, features = ["serde"] }

[features]
torrent = ["dep:async-trait"]
torrent-librqbit = ["torrent", "dep:librqbit", "dep:tokio-util"]
